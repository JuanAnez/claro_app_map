name: icc_claro_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.12.1
  jwt_decode: ^0.3.1
  shared_preferences: ^2.5.3
  provider: ^6.1.4
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  permission_handler: ^12.0.0+1
  http: ^1.2.2
  flutter_svg: ^1.1.6
  geolocator: ^14.0.0
  material_symbols_icons: ^4.2815.0
  turf: ^0.0.10
  file_picker: ^10.1.8
  multi_select_flutter: ^4.1.3
  sqflite: ^2.4.2
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_speed_dial: ^7.0.0
  image_picker: ^1.1.2
  open_file: ^3.5.10
  mime: ^1.0.6
  flutter_local_notifications: ^19.1.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  timezone: ^0.10.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icclaro.png
    - assets/icons/icon.png
    - assets/images/background.jpg
    - assets/images/clarologo.png
    - assets/images/icc_claro_appbar.png
    - assets/geojson/puerto_rico.geojson
    - assets/icons/loading_claro.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  image_path_android_round: "assets/images/ic_launcher_round.png"

